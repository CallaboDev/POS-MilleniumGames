<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">

<head th:replace="~{fragments/header :: header('Catálogo de Productos')}">
    <title>Catálogo de Productos | Millenium Games POS</title>
</head>

<body>

<div class="app-layout">
    <div th:replace="~{fragments/sidebar :: sidebar}"></div>
    <div class="sidebar-overlay" id="sidebarOverlay"></div>

    <div class="main-wrapper" id="mainWrapper">
        <header th:replace="~{fragments/navbar :: navbar}"></header>

        <main class="p-3 p-md-4 p-xl-5 flex-grow-1">
            <!-- Alert de Notificaciones -->
            <div th:if="${exito}" class="alert alert-success alert-dismissible fade show rounded-3 mb-4 shadow-sm" role="alert">
                <i class="bi bi-check-circle-fill me-2"></i><span th:text="${exito}"></span>
                <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
            </div>
            <div th:if="${error}" class="alert alert-danger alert-dismissible fade show rounded-3 mb-4 shadow-sm" role="alert">
                <i class="bi bi-exclamation-triangle-fill me-2"></i><span th:text="${error}"></span>
                <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
            </div>

            <!-- Header de Sección -->
            <div class="d-flex flex-column flex-md-row justify-content-between align-items-md-center gap-3 mb-4 pb-2 border-bottom">
                <div>
                    <h1 class="h3 fw-bold text-dark mb-1">Catálogo de Productos</h1>
                    <p class="text-secondary mb-0">Gestión de inventario de videojuegos, consolas y accesorios.</p>
                </div>
                <div>
                    <a th:href="@{/productos/nuevo}" class="btn btn-primary px-3 py-2 fw-semibold d-inline-flex align-items-center gap-2 shadow-sm rounded-3">
                        <i class="bi bi-plus-lg"></i>
                        <span>Nuevo Producto</span>
                    </a>
                </div>
            </div>

            <!-- Filtro de Búsqueda -->
            <div class="card border-0 shadow-sm rounded-4 bg-white mb-4">
                <div class="card-body p-3 p-sm-4">
                    <form th:action="@{/productos}" method="get" class="row g-2 align-items-center">
                        <div class="col-12 col-md-8 col-lg-6">
                            <div class="input-group">
                                <span class="input-group-text bg-light border-end-0 text-muted"><i class="bi bi-search"></i></span>
                                <input type="text" name="buscar" th:value="${buscar}" class="form-control bg-light border-start-0" placeholder="Buscar por nombre de producto...">
                            </div>
                        </div>
                        <div class="col-12 col-md-4 col-lg-2 d-flex gap-2">
                            <button type="submit" class="btn btn-secondary w-100 fw-semibold">Buscar</button>
                            <a th:if="${buscar != null}" th:href="@{/productos}" class="btn btn-outline-secondary" title="Limpiar búsqueda"><i class="bi bi-x-lg"></i></a>
                        </div>
                    </form>
                </div>
            </div>

            <!-- Tabla de Productos -->
            <div class="card border-0 shadow-sm rounded-4 bg-white">
                <div class="card-body p-0">
                    <div class="table-responsive">
                        <table class="table table-hover align-middle mb-0">
                            <thead class="table-light">
                                <tr>
                                    <th class="ps-4" style="width: 80px;">Portada</th>
                                    <th>SKU</th>
                                    <th>Nombre</th>
                                    <th>Categoría</th>
                                    <th>Plataforma</th>
                                    <th>Precio</th>
                                    <th>Stock</th>
                                    <th class="text-end pe-4">Acciones</th>
                                </tr>
                            </thead>
                            <tbody>
                                <tr th:each="producto : ${productos}">
                                    <td class="ps-4">
                                        <img th:if="${producto.imagen != null}" th:src="@{'/uploads/' + ${producto.imagen}}" class="rounded border object-fit-cover" style="width: 48px; height: 48px;" alt="Portada">
                                        <div th:unless="${producto.imagen != null}" class="bg-light rounded border d-flex align-items-center justify-content-center text-muted" style="width: 48px; height: 48px;">
                                            <i class="bi bi-controller fs-4"></i>
                                        </div>
                                    </td>
                                    <td class="fw-semibold text-secondary" th:text="${producto.sku}">SKU-001</td>
                                    <td>
                                        <span class="fw-bold text-dark d-block" th:text="${producto.nombre}">Nombre del Producto</span>
                                        <small class="text-muted text-truncate d-inline-block" style="max-width: 250px;" th:text="${producto.descripcion}"></small>
                                    </td>
                                    <td>
                                        <span class="badge bg-primary-subtle text-primary border border-primary-subtle rounded-pill" th:text="${producto.categoria != null ? producto.categoria.nombre : 'N/A'}">Categoría</span>
                                    </td>
                                    <td>
                                        <span class="badge bg-secondary-subtle text-secondary border border-secondary-subtle rounded-pill" th:text="${producto.plataforma != null ? producto.plataforma.nombre : 'N/A'}">Plataforma</span>
                                    </td>
                                    <td class="fw-bold text-dark" th:text="${'$' + #numbers.formatDecimal(producto.precio, 1, 'COMMA', 2, 'POINT')}">$0.00</td>
                                    <td>
                                        <span th:class="${producto.stock > 5 ? 'badge bg-success-subtle text-success' : (producto.stock > 0 ? 'badge bg-warning-subtle text-warning-emphasis' : 'badge bg-danger-subtle text-danger')}"
                                              th:text="${producto.stock + ' unids.'}">0 unids.</span>
                                    </td>
                                    <td class="text-end pe-4">
                                        <a th:href="@{'/productos/editar/' + ${producto.id}}" class="btn btn-sm btn-outline-primary me-1" title="Editar">
                                            <i class="bi bi-pencil"></i>
                                        </a>
                                        <a th:href="@{'/productos/eliminar/' + ${producto.id}}" class="btn btn-sm btn-outline-danger" onclick="return confirm('¿Está seguro de eliminar este producto?');" title="Eliminar">
                                            <i class="bi bi-trash"></i>
                                        </a>
                                    </td>
                                </tr>
                                <tr th:if="${#lists.isEmpty(productos)}">
                                    <td colspan="8" class="text-center py-4 text-muted">
                                        No se encontraron productos registrados.
                                    </td>
                                </tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
        </main>

        <footer th:replace="~{fragments/footer :: footer}"></footer>
    </div>

</div>

</body>
</html>
