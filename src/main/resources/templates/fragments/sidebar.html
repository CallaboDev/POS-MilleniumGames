<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<body>

<!-- Fragmento de Sidebar Lateral Izquierdo -->
<aside th:fragment="sidebar" id="sidebar" class="sidebar">
    <!-- Superior: Marca / Icono distintivo de la tienda o Carrito POS enlazado a /caja -->
    <a th:href="@{/}" class="sidebar-brand">
        <div class="sidebar-brand-icon">
            <i class="bi bi-controller"></i>
        </div>
        <div class="brand-text d-flex flex-column">
            <span class="fw-bold text-white fs-6 lh-1">Millenium Games</span>
            <span class="text-primary-emphasis small fw-semibold" style="font-size: 0.75rem;">Terminal POS</span>
        </div>
    </a>

    <!-- Menú Central de Iconos y Rutas -->
    <ul class="nav-list">
        <!-- Dashboard / Inicio -->
        <li>
            <a th:href="@{/dashboard}" class="nav-link-item active" title="Dashboard / Inicio">
                <i class="bi bi-speedometer2"></i>
                <span class="link-text">Dashboard</span>
            </a>
        </li>
        <!-- Caja (POS) -->
        <li>
            <a th:href="@{/caja}" class="nav-link-item" title="Caja (POS)">
                <i class="bi bi-cart-fill"></i>
                <span class="link-text">Caja (POS)</span>
            </a>
        </li>
        <!-- Videojuegos -->
        <li>
            <a th:href="@{/productos}" class="nav-link-item" title="Videojuegos">
                <i class="bi bi-box-seam"></i>
                <span class="link-text">Videojuegos</span>
            </a>
        </li>
        <!-- Clientes -->
        <li>
            <a th:href="@{/clientes}" class="nav-link-item" title="Clientes">
                <i class="bi bi-people"></i>
                <span class="link-text">Clientes</span>
            </a>
        </li>
        <!-- Reportes: solo ADMIN -->
        <li sec:authorize="hasRole('ADMIN')">
            <a th:href="@{/reportes}" class="nav-link-item" title="Reportes">
                <i class="bi bi-graph-up"></i>
                <span class="link-text">Reportes</span>
            </a>
        </li>
        <!-- Usuarios: solo ADMIN -->
        <li sec:authorize="hasRole('ADMIN')">
            <a th:href="@{/usuarios}" class="nav-link-item" title="Usuarios">
                <i class="bi bi-person-badge"></i>
                <span class="link-text">Usuarios</span>
            </a>
        </li>
    </ul>

    <!-- Inferior: Avatar de usuario circular azul en la parte baja -->
    <div class="sidebar-user">
        <div class="avatar-circle">
            <i class="bi bi-person-fill"></i>
        </div>
        <div class="user-details d-flex flex-column">
            <span class="fw-semibold text-white small lh-1 text-truncate"
                  th:text="${nombreUsuarioLogueado}">Nombre</span>
            <span class="text-secondary small mt-1" style="font-size: 0.75rem;"
                  sec:authentication="name">Username</span>
        </div>
    </div>
</aside>

</body>
</html>
