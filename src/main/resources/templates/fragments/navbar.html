<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>

<!-- Top Navbar Superior (Fondo blanco, sombra sutil) -->
<header th:fragment="navbar" class="top-navbar px-3 px-lg-4 d-flex align-items-center justify-content-between gap-2">
    <!-- Lado Izquierdo: Botón hamburguesa y Título en negrita -->
    <div class="d-flex align-items-center gap-2 gap-sm-3 min-w-0">
        <button id="sidebarToggle"
                class="btn btn-light border rounded-3 p-2 d-flex align-items-center justify-content-center shadow-sm flex-shrink-0"
                type="button" aria-label="Alternar barra lateral" style="width: 40px; height: 40px;">
            <i class="bi bi-list fs-5 text-dark"></i>
        </button>
        <h1 class="h5 fw-bold mb-0 text-dark d-flex align-items-center gap-2 navbar-title-text">
            Panel de Control POS
        </h1>
    </div>

    <!-- Lado Derecho: Controles -->
    <div class="d-flex align-items-center gap-2 gap-sm-3 flex-shrink-0">
        <!-- Botón de Modo Oscuro -->
        <button id="themeToggleBtn" class="btn btn-outline-secondary btn-sm rounded-pill px-3 py-1.5 fw-semibold d-inline-flex align-items-center gap-1.5 shadow-sm" type="button" aria-label="Cambiar tema">
            <i class="bi bi-moon-fill" id="themeIcon"></i>
            <span class="d-none d-sm-inline" id="themeText">Modo oscuro</span>
        </button>

        <!-- Formulario de Salir -->
        <form th:action="@{/logout}" method="post" class="m-0 p-0 d-inline">
            <button type="submit"
                    aria-label="Cerrar sesión"
                    class="btn btn-outline-danger btn-sm rounded-pill px-3 py-1.5 fw-semibold d-inline-flex align-items-center gap-1.5 shadow-sm">
                <i class="bi bi-box-arrow-right"></i>
                <span class="navbar-logout-text">Salir</span>
            </button>
        </form>
    </div>
</header>

</body>
</html>
