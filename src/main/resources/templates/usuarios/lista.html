<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/header :: header('Personal')}">
    <title>Personal | Millenium Games POS</title>
</head>
<body>
<div class="app-layout">
    <div th:replace="~{fragments/sidebar :: sidebar}"></div>
    <div class="sidebar-overlay" id="sidebarOverlay"></div>

    <div class="main-wrapper" id="mainWrapper">
        <header th:replace="~{fragments/navbar :: navbar}"></header>

        <main class="p-3 p-md-4 p-xl-5 flex-grow-1">
            <div class="d-flex flex-column flex-md-row justify-content-between align-items-md-center gap-3 mb-4 pb-3 border-bottom">
                <div>
                    <h1 class="h3 fw-bold text-dark mb-1">Personal</h1>
                    <p class="text-secondary mb-0">Administra las cuentas y roles de los empleados.</p>
                </div>
                <a th:href="@{/usuarios/nuevo}"
                   class="btn btn-primary px-3 py-2 fw-semibold d-inline-flex align-items-center gap-2 shadow-sm rounded-3">
                    <i class="bi bi-plus-lg"></i>
                    <span>Nuevo empleado</span>
                </a>
            </div>

            <div class="alert alert-success alert-dismissible fade show" role="alert" th:if="${mensaje}">
                <span th:text="${mensaje}"></span>
                <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Cerrar"></button>
            </div>
            <div class="alert alert-danger alert-dismissible fade show" role="alert" th:if="${error}">
                <span th:text="${error}"></span>
                <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Cerrar"></button>
            </div>

            <section class="card border-0 shadow-sm rounded-4">
                <div class="card-header bg-white border-bottom px-3 px-md-4 py-3">
                    <h2 class="h5 fw-bold mb-0">Empleados registrados</h2>
                </div>
                <div class="table-responsive">
                    <table class="table table-hover align-middle mb-0">
                        <thead class="table-light">
                        <tr>
                            <th scope="col" class="px-3 px-md-4">ID</th>
                            <th scope="col">Username</th>
                            <th scope="col">Nombre</th>
                            <th scope="col">Roles</th>
                            <th scope="col" class="text-end px-3 px-md-4">Acciones</th>
                        </tr>
                        </thead>
                        <tbody>
                        <tr th:each="usuario : ${usuarios}">
                            <td class="px-3 px-md-4 text-secondary" th:text="${usuario.id}"></td>
                            <td class="fw-semibold text-white" th:text="${usuario.username}"></td>
                            <td class="text-white" th:text="${usuario.nombre}"></td>
                            <td>
                                <span th:each="rol : ${usuario.roles}" class="badge rounded-pill me-1"
                                      th:classappend="${rol.nombre == 'ROLE_ADMIN'} ? ' text-bg-primary' : ' text-bg-secondary'"
                                      th:text="${#strings.replace(rol.nombre, 'ROLE_', '')}"></span>
                            </td>
                            <td class="text-end px-3 px-md-4 text-nowrap">
                                <a th:href="@{/usuarios/editar/{id}(id=${usuario.id})}"
                                   class="btn btn-sm btn-outline-primary rounded-3" title="Editar">
                                    <i class="bi bi-pencil-square"></i>
                                    <span class="d-none d-md-inline">Editar</span>
                                </a>
                                <form th:unless="${usuario.id == usuarioActualId}" th:action="@{/usuarios/eliminar/{id}(id=${usuario.id})}"
                                      method="post" class="d-inline" data-confirm-delete
                                      data-confirm-message="¿Estás seguro de que deseas eliminar esta cuenta de usuario? Esta acción no se puede deshacer.">
                                    <button type="submit" class="btn btn-sm btn-outline-danger rounded-3 ms-1" title="Eliminar">
                                        <i class="bi bi-trash"></i>
                                        <span class="d-none d-md-inline">Eliminar</span>
                                    </button>
                                </form>
                                <span th:if="${usuario.id == usuarioActualId}" class="badge text-bg-light border ms-1"
                                      title="No puedes eliminar la cuenta con la que has iniciado sesión">
                                    <i class="bi bi-shield-lock me-1" aria-hidden="true"></i>Tu cuenta
                                </span>
                            </td>
                        </tr>
                        <tr th:if="${#lists.isEmpty(usuarios)}">
                            <td colspan="5" class="text-center text-secondary py-5">
                                No hay empleados registrados todavía.
                            </td>
                        </tr>
                        </tbody>
                    </table>
                </div>

                <!-- Barra de Paginación Real Automática (10 empleados por página) -->
                <div id="paginacionUsuariosContainer"
                     class="card-footer bg-light border-top px-3 px-md-4 py-2 d-flex flex-column flex-sm-row justify-content-between align-items-center gap-2">
                    <small class="text-secondary fw-medium" id="paginacionUsuariosInfo"></small>
                    <nav aria-label="Paginación de empleados">
                        <ul class="pagination pagination-sm mb-0 flex-wrap justify-content-center" id="paginacionUsuarios"></ul>
                    </nav>
                </div>
            </section>
        </main>

        <footer th:replace="~{fragments/footer :: footer}"></footer>
    </div>
</div>

<script th:inline="javascript">
    const USUARIOS_PAGE_STATE = {
        page: /*[[${usuariosPage != null ? usuariosPage.number : 0}]]*/ 0,
        size: /*[[${usuariosPage != null ? usuariosPage.size : 10}]]*/ 10,
        totalElements: /*[[${usuariosPage != null ? usuariosPage.totalElements : #lists.size(usuarios)}]]*/ 0,
        totalPages: /*[[${usuariosPage != null ? usuariosPage.totalPages : 1}]]*/ 1
    };
</script>

<script>
    (function () {
        const state = USUARIOS_PAGE_STATE;
        const infoEl = document.getElementById('paginacionUsuariosInfo');
        const ulEl = document.getElementById('paginacionUsuarios');

        function construirUrlPagina(pagina) {
            return '/usuarios?page=' + String(pagina);
        }

        function construirPaginasVisibles(actual, total) {
            if (total <= 7) {
                return Array.from({ length: total }, (_, i) => i);
            }

            const paginas = new Set([0, total - 1]);
            const inicio = Math.max(1, actual - 1);
            const fin = Math.min(total - 2, actual + 1);

            if (actual <= 2) {
                paginas.add(1);
                paginas.add(2);
                paginas.add(3);
            } else if (actual >= total - 3) {
                paginas.add(total - 4);
                paginas.add(total - 3);
                paginas.add(total - 2);
            } else {
                for (let i = inicio; i <= fin; i++) {
                    paginas.add(i);
                }
            }

            const ordenadas = Array.from(paginas).filter(p => p >= 0 && p < total).sort((a, b) => a - b);
            const resultado = [];
            let anterior = -1;
            ordenadas.forEach(p => {
                if (anterior !== -1 && p - anterior > 1) {
                    resultado.push('...');
                }
                resultado.push(p);
                anterior = p;
            });
            return resultado;
        }

        if (infoEl) {
            if (state.totalElements === 0) {
                infoEl.textContent = '0 empleados encontrados';
            } else {
                const desde = state.page * state.size + 1;
                const hasta = Math.min((state.page + 1) * state.size, state.totalElements);
                infoEl.textContent = `Mostrando ${desde}–${hasta} de ${state.totalElements} empleados (Pág. ${state.page + 1} de ${state.totalPages})`;
            }
        }

        if (ulEl && state.totalPages > 1) {
            const actual = state.page;
            const total = state.totalPages;
            const items = [];

            if (actual <= 0) {
                items.push('<li class="page-item disabled"><span class="page-link" aria-label="Anterior"><i class="bi bi-chevron-left"></i></span></li>');
            } else {
                items.push(`<li class="page-item"><a class="page-link" href="${construirUrlPagina(actual - 1)}" aria-label="Anterior"><i class="bi bi-chevron-left"></i></a></li>`);
            }

            construirPaginasVisibles(actual, total).forEach(item => {
                if (item === '...') {
                    items.push('<li class="page-item disabled"><span class="page-link">…</span></li>');
                } else if (item === actual) {
                    items.push(`<li class="page-item active"><span class="page-link" aria-current="page">${item + 1}</span></li>`);
                } else {
                    items.push(`<li class="page-item"><a class="page-link" href="${construirUrlPagina(item)}">${item + 1}</a></li>`);
                }
            });

            if (actual >= total - 1) {
                items.push('<li class="page-item disabled"><span class="page-link" aria-label="Siguiente"><i class="bi bi-chevron-right"></i></span></li>');
            } else {
                items.push(`<li class="page-item"><a class="page-link" href="${construirUrlPagina(actual + 1)}" aria-label="Siguiente"><i class="bi bi-chevron-right"></i></a></li>`);
            }

            ulEl.innerHTML = items.join('');
        }
    })();
</script>
</body>
</html>
