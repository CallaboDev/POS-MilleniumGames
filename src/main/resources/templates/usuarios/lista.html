<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/header :: header('Personal')}">
    <title>Personal | Millenium Games POS</title>
</head>
<body>
<div class="app-layout">
    <div th:replace="~{fragments/sidebar :: sidebar}"></div>
    <div class="sidebar-overlay" id="sidebarOverlay"></div>

    <div class="main-wrapper" id="mainWrapper">
        <header th:replace="~{fragments/navbar :: navbar}"></header>

        <main class="p-3 p-md-4 p-xl-5 flex-grow-1">
            <div class="d-flex flex-column flex-md-row justify-content-between align-items-md-center gap-3 mb-4 pb-3 border-bottom">
                <div>
                    <h1 class="h3 fw-bold text-dark mb-1">Personal</h1>
                    <p class="text-secondary mb-0">Administra las cuentas y roles de los empleados.</p>
                </div>
                <a th:href="@{/usuarios/nuevo}"
                   class="btn btn-primary px-3 py-2 fw-semibold d-inline-flex align-items-center gap-2 shadow-sm rounded-3">
                    <i class="bi bi-plus-lg"></i>
                    <span>Nuevo empleado</span>
                </a>
            </div>

            <div class="alert alert-success alert-dismissible fade show" role="alert" th:if="${mensaje}">
                <span th:text="${mensaje}"></span>
                <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Cerrar"></button>
            </div>
            <div class="alert alert-danger alert-dismissible fade show" role="alert" th:if="${error}">
                <span th:text="${error}"></span>
                <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Cerrar"></button>
            </div>

            <section class="card border-0 shadow-sm rounded-4">
                <div class="card-header bg-white border-bottom px-3 px-md-4 py-3">
                    <h2 class="h5 fw-bold mb-0">Empleados registrados</h2>
                </div>
                <div class="table-responsive">
                    <table class="table table-hover align-middle mb-0">
                        <thead class="table-light">
                        <tr>
                            <th scope="col" class="px-3 px-md-4">ID</th>
                            <th scope="col">Username</th>
                            <th scope="col">Nombre</th>
                            <th scope="col">Roles</th>
                            <th scope="col" class="text-end px-3 px-md-4">Acciones</th>
                        </tr>
                        </thead>
                        <tbody>
                        <tr th:each="usuario : ${usuarios}">
                            <td class="px-3 px-md-4 text-secondary" th:text="${usuario.id}"></td>
                            <td class="fw-semibold" th:text="${usuario.username}"></td>
                            <td th:text="${usuario.nombre}"></td>
                            <td>
                                <span th:each="rol : ${usuario.roles}" class="badge rounded-pill me-1"
                                      th:classappend="${rol.nombre == 'ROLE_ADMIN'} ? ' text-bg-primary' : ' text-bg-secondary'"
                                      th:text="${#strings.replace(rol.nombre, 'ROLE_', '')}"></span>
                            </td>
                            <td class="text-end px-3 px-md-4 text-nowrap">
                                <a th:href="@{/usuarios/editar/{id}(id=${usuario.id})}"
                                   class="btn btn-sm btn-outline-primary rounded-3" title="Editar">
                                    <i class="bi bi-pencil-square"></i>
                                    <span class="d-none d-md-inline">Editar</span>
                                </a>
                                <a th:href="@{/usuarios/eliminar/{id}(id=${usuario.id})}"
                                   class="btn btn-sm btn-outline-danger rounded-3 ms-1" title="Eliminar"
                                   onclick="return confirm('Seguro que deseas eliminar este empleado?');">
                                    <i class="bi bi-trash"></i>
                                    <span class="d-none d-md-inline">Eliminar</span>
                                </a>
                            </td>
                        </tr>
                        <tr th:if="${#lists.isEmpty(usuarios)}">
                            <td colspan="5" class="text-center text-secondary py-5">
                                No hay empleados registrados todava.
                            </td>
                        </tr>
                        </tbody>
                    </table>
                </div>
            </section>
        </main>

        <footer th:replace="~{fragments/footer :: footer}"></footer>
    </div>
</div>
</body>
</html>
