<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#071a3a">
    <title>Iniciar sesión | Millenium Games POS</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@100;200;300;400;500;600;700;800;900&display=swap"
          rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/login.css(v=3)}">
    <script>
        (function() {
            var theme = localStorage.getItem("theme");
            if (theme === "dark") {
                document.documentElement.setAttribute("data-theme", "dark");
            }
        })();
    </script>
</head>
<body>
<main class="login-card">
    <div class="brand-mark" aria-hidden="true">M</div>
    <h1>Bienvenido</h1>
    <p class="subtitle">Inicio de sesión de Millenium Games POS</p>

    <div class="error" role="alert" th:if="${param.error}">Usuario o contraseña incorrectos</div>
    <div class="error" role="alert" th:if="${param.denied}">Tu cuenta no tiene permiso para acceder a esa sección.</div>
    <div class="success" role="alert" th:if="${param.logout}">Has cerrado sesión exitosamente.</div>

    <form th:action="@{/login}" method="post">
        <!-- Thymeleaf includes CSRF token automatically when using th:action with POST -->
        <div class="field">
            <label for="username">Nombre de usuario</label>
            <div class="input-control">
                <svg class="input-icon" viewBox="0 0 24 24" fill="none" aria-hidden="true">
                    <rect x="3" y="5" width="18" height="14" rx="2" stroke="currentColor" stroke-width="1.8"/>
                    <path d="m4 7 8 6 8-6" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
                </svg>
                <input id="username" name="username" type="text" autocomplete="username" placeholder="Escribe tu usuario" required autofocus>
            </div>
        </div>
        <div class="field">
            <label for="password">Contraseña</label>
            <div class="input-control">
                <svg class="input-icon" viewBox="0 0 24 24" fill="none" aria-hidden="true">
                    <rect x="5" y="10" width="14" height="11" rx="2" stroke="currentColor" stroke-width="1.8"/>
                    <path d="M8 10V7a4 4 0 0 1 8 0v3" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
                    <circle cx="12" cy="15" r="1" fill="currentColor"/>
                    <path d="M12 16v2" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
                </svg>
                <input id="password" name="password" type="password" autocomplete="current-password" placeholder="Escribe tu contraseña" required>
                <button class="password-toggle" id="password-toggle" type="button" aria-label="Mostrar contraseña" aria-pressed="false" aria-controls="password">
                    <svg class="eye-icon eye-open" viewBox="0 0 24 24" fill="none" aria-hidden="true">
                        <path d="M2.5 12s3.3-6 9.5-6 9.5 6 9.5 6-3.3 6-9.5 6-9.5-6-9.5-6Z" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/>
                        <circle cx="12" cy="12" r="2.7" stroke="currentColor" stroke-width="1.8"/>
                    </svg>
                    <svg class="eye-icon eye-closed" viewBox="0 0 24 24" fill="none" aria-hidden="true">
                        <path d="m3 3 18 18M10.6 6.2A10.8 10.8 0 0 1 12 6c6.2 0 9.5 6 9.5 6a15 15 0 0 1-3 3.6M6.2 6.8C3.8 8.4 2.5 12 2.5 12s3.3 6 9.5 6c1.2 0 2.3-.2 3.3-.6" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
                    </svg>
                </button>
            </div>
        </div>
        <button type="submit">Iniciar sesión</button>
    </form>
</main>
<script>
    const passwordInput = document.getElementById("password");
    const passwordToggle = document.getElementById("password-toggle");

    passwordToggle.addEventListener("click", function () {
        const isVisible = passwordInput.type === "text";
        passwordInput.type = isVisible ? "password" : "text";
        passwordToggle.setAttribute("aria-pressed", String(!isVisible));
        passwordToggle.setAttribute("aria-label", isVisible ? "Mostrar contraseña" : "Ocultar contraseña");
        passwordToggle.classList.toggle("is-visible", !isVisible);
    });
</script>
</body>
</html>
