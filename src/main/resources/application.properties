spring.application.name=POS-MilleniumGames
# PUERTO DINÁMICO (Compatible con Render y Local)
server.port=${PORT:8080}
# CONEXIÓN A POSTGRESQL (Configurada para Local y Render)
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/pos_milleniumgames}
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASSWORD:1234}
spring.datasource.driver-class-name=org.postgresql.Driver
# CONFIGURACIÓN JPA / HIBERNATE
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
# ZONA HORARIA Y FECHAS
spring.jackson.date-format=yyyy-MM-dd HH:mm:ss
spring.jackson.time-zone=America/El_Salvador
# SUBIDA DE ARCHIVOS (PORTADAS DE JUEGOS)
spring.servlet.multipart.max-file-size=3MB
spring.servlet.multipart.max-request-size=3MB
