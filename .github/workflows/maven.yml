name: Java CI with Maven

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    # Servicio de PostgreSQL para que contextLoads() se conecte con éxito
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: millenium_db
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
    - name: Checkout del repositorio
      uses: actions/checkout@v4

    - name: Set up Liberica JDK 21
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'liberica'
        cache: maven

    - name: Compilar y ejecutar pruebas con Maven
      env:
        SPRING_DATASOURCE_URL: jdbc:postgresql://localhost:5432/millenium_db
        SPRING_DATASOURCE_USERNAME: postgres
        SPRING_DATASOURCE_PASSWORD: postgres
      run: mvn -B package --file pom.xml
